name: Android Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, or a unique tag for an Android pre-release"
        required: true
        default: "v4.10.8"
      title:
        description: "Release title"
        required: false
        default: "MudaRemote v4.10.8"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Require and restore release signing configuration
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KS_STORE_PASSWORD: ${{ secrets.ANDROID_KS_STORE_PASSWORD }}
          ANDROID_KS_ALIAS: ${{ secrets.ANDROID_KS_ALIAS }}
          ANDROID_KS_KEY_PASSWORD: ${{ secrets.ANDROID_KS_KEY_PASSWORD }}
        working-directory: android
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_B64:?ANDROID_KEYSTORE_B64 is required}"
          : "${ANDROID_KS_STORE_PASSWORD:?ANDROID_KS_STORE_PASSWORD is required}"
          : "${ANDROID_KS_ALIAS:?ANDROID_KS_ALIAS is required}"
          : "${ANDROID_KS_KEY_PASSWORD:?ANDROID_KS_KEY_PASSWORD is required}"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > mudaremote-release.jks
          test -s mudaremote-release.jks
          cat > keystore.properties <<EOF
          storeFile=mudaremote-release.jks
          storePassword=${ANDROID_KS_STORE_PASSWORD}
          keyAlias=${ANDROID_KS_ALIAS}
          keyPassword=${ANDROID_KS_KEY_PASSWORD}
          EOF
          keytool -list -keystore mudaremote-release.jks \
            -storepass "$ANDROID_KS_STORE_PASSWORD" -alias "$ANDROID_KS_ALIAS" >/dev/null

      - name: Build ux APK
        working-directory: android
        run: gradle :app:testUxUnitTest :app:assembleUx --no-daemon --stacktrace

      - name: Stage release APK
        run: |
          SRC="android/app/build/outputs/apk/ux/app-ux.apk"
          test -s "$SRC" || { echo "APK missing at $SRC"; exit 1; }
          cp "$SRC" Mudaremote.apk
          ls -lh Mudaremote.apk

      - name: Verify stable APK signer continuity
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT" || { echo "::error::Android SDK path is unavailable"; exit 1; }
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$APKSIGNER" && test -x "$APKSIGNER" || { echo "::error::apksigner is unavailable"; exit 1; }
          VERIFY_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs Mudaremote.apk)"
          printf '%s\n' "$VERIFY_OUTPUT"
          SIGNER_COUNT="$(printf '%s\n' "$VERIFY_OUTPUT" | sed -n 's/^Number of signers: //p')"
          SIGNER_SHA256="$(printf '%s\n' "$VERIFY_OUTPUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          EXPECTED_SIGNER_SHA256="aefcfd68eae4fcddf789a654b90c4818fa128aca9e52bceb2767b39ff6587839"
          test "$SIGNER_COUNT" = "1" || { echo "::error::Expected exactly one APK signer"; exit 1; }
          test "$SIGNER_SHA256" = "$EXPECTED_SIGNER_SHA256" || {
            echo "::error::APK signer does not match the verified v4.9.8 stable signer"
            exit 1
          }

      - name: Write release notes
        run: cp packaging/release-notes-v4.10.8.md release_notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: Mudaremote-apk
          path: Mudaremote.apk

      - name: Publish Android asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
          TITLE: ${{ github.event.inputs.title }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" Mudaremote.apk --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file release_notes.md
            echo "Updated asset on existing release $TAG"
          else
            if [ "$TAG" = "v4.10.8" ]; then
              echo "::error::Publish the Windows stable release before attaching its Android APK."
              exit 1
            fi
            gh release create "$TAG" Mudaremote.apk \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file release_notes.md
            echo "Created pre-release $TAG"
          fi

      - name: Verify published release notes and APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          gh release view "$TAG" --json body,isPrerelease,assets > published-release.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          release = json.loads(Path("published-release.json").read_text())
          assert release["isPrerelease"] is (os.environ["TAG"] != "v4.10.8")
          assert release["body"].strip() == Path("release_notes.md").read_text().strip()
          assets = [a for a in release["assets"] if a["name"] == "Mudaremote.apk"]
          assert len(assets) == 1 and assets[0]["size"] == Path("Mudaremote.apk").stat().st_size
          PY
