name: Android Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, or a unique tag for an Android pre-release"
        required: true
        default: "v4.9.2"
      title:
        description: "Release title"
        required: false
        default: "MudaRemote v4.9.2"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KS_STORE_PASSWORD: ${{ secrets.ANDROID_KS_STORE_PASSWORD }}
          ANDROID_KS_ALIAS: ${{ secrets.ANDROID_KS_ALIAS }}
          ANDROID_KS_KEY_PASSWORD: ${{ secrets.ANDROID_KS_KEY_PASSWORD }}
        working-directory: android
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE_B64 not set; falling back to debug signing (updates will not install over signed releases)."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > mudaremote-release.jks
          cat > keystore.properties <<EOF
          storeFile=mudaremote-release.jks
          storePassword=${ANDROID_KS_STORE_PASSWORD}
          keyAlias=${ANDROID_KS_ALIAS}
          keyPassword=${ANDROID_KS_KEY_PASSWORD}
          EOF

      - name: Build ux APK
        working-directory: android
        run: gradle :app:testUxUnitTest :app:assembleUx --no-daemon --stacktrace

      - name: Stage release APK
        run: |
          SRC="android/app/build/outputs/apk/ux/app-ux.apk"
          test -s "$SRC" || { echo "APK missing at $SRC"; exit 1; }
          cp "$SRC" Mudaremote.apk
          ls -lh Mudaremote.apk

      - name: Write release notes
        run: cp packaging/release-notes-v4.9.2.md release_notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: Mudaremote-apk
          path: Mudaremote.apk

      - name: Publish Android asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
          TITLE: ${{ github.event.inputs.title }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" Mudaremote.apk --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file release_notes.md
            echo "Updated asset on existing release $TAG"
          else
            if [ "$TAG" = "v4.9.2" ]; then
              echo "::error::Publish the Windows stable release before attaching its Android APK."
              exit 1
            fi
            gh release create "$TAG" Mudaremote.apk \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file release_notes.md
            echo "Created pre-release $TAG"
          fi

      - name: Verify published release notes and APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          gh release view "$TAG" --json body,isPrerelease,assets > published-release.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          release = json.loads(Path("published-release.json").read_text())
          assert release["isPrerelease"] == (os.environ["TAG"] != "v4.9.2")
          assert release["body"].strip() == Path("release_notes.md").read_text().strip()
          assets = [a for a in release["assets"] if a["name"] == "Mudaremote.apk"]
          assert len(assets) == 1 and assets[0]["size"] == Path("Mudaremote.apk").stat().st_size
          PY
