name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, or a unique tag for an Android pre-release"
        required: true
        default: "v6.0.0"
      title:
        description: "Release title"
        required: false
        default: "MudaFork v6.0.0"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Require and restore release signing configuration
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KS_STORE_PASSWORD: ${{ secrets.ANDROID_KS_STORE_PASSWORD }}
          ANDROID_KS_ALIAS: ${{ secrets.ANDROID_KS_ALIAS }}
          ANDROID_KS_KEY_PASSWORD: ${{ secrets.ANDROID_KS_KEY_PASSWORD }}
        working-directory: android
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_B64:?ANDROID_KEYSTORE_B64 is required}"
          : "${ANDROID_KS_STORE_PASSWORD:?ANDROID_KS_STORE_PASSWORD is required}"
          : "${ANDROID_KS_ALIAS:?ANDROID_KS_ALIAS is required}"
          : "${ANDROID_KS_KEY_PASSWORD:?ANDROID_KS_KEY_PASSWORD is required}"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > mudafork-release.jks
          test -s mudafork-release.jks
          cat > keystore.properties <<EOF
          storeFile=mudafork-release.jks
          storePassword=${ANDROID_KS_STORE_PASSWORD}
          keyAlias=${ANDROID_KS_ALIAS}
          keyPassword=${ANDROID_KS_KEY_PASSWORD}
          EOF
          keytool -list -keystore mudafork-release.jks \
            -storepass "$ANDROID_KS_STORE_PASSWORD" -alias "$ANDROID_KS_ALIAS" >/dev/null

      - name: Build ux APK
        working-directory: android
        run: gradle :app:testUxUnitTest :app:assembleUx --no-daemon --stacktrace

      - name: Stage release APK
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          SRC="android/app/build/outputs/apk/ux/app-ux.apk"
          test -s "$SRC" || { echo "APK missing at $SRC"; exit 1; }
          cp "$SRC" "MudaFork-${VERSION}.apk"
          echo "APK_NAME=MudaFork-${VERSION}.apk" >> "$GITHUB_ENV"
          echo "APK_VERSION=${VERSION}" >> "$GITHUB_ENV"
          ls -lh "MudaFork-${VERSION}.apk"

      - name: Verify stable APK signer continuity
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT" || { echo "::error::Android SDK path is unavailable"; exit 1; }
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$APKSIGNER" && test -x "$APKSIGNER" || { echo "::error::apksigner is unavailable"; exit 1; }
          VERIFY_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK_NAME")"
          printf '%s\n' "$VERIFY_OUTPUT"
          SIGNER_COUNT="$(printf '%s\n' "$VERIFY_OUTPUT" | sed -n 's/^Number of signers: //p')"
          # Older apksigner prints "Signer #1 certificate ...", newer "V2 Signer: certificate ...";
          # every certificate line it prints must name the same, expected signer.
          SIGNER_SHA256="$(printf '%s\n' "$VERIFY_OUTPUT" | sed -n -E 's/^(Signer #1|V[0-9.]+ Signer):? certificate SHA-256 digest: //p' | sort -u)"
          test "$SIGNER_COUNT" = "1" || { echo "::error::Expected exactly one APK signer"; exit 1; }
          test -n "$SIGNER_SHA256" && test "$(printf '%s\n' "$SIGNER_SHA256" | wc -l)" = "1" || {
            echo "::error::Expected exactly one signer certificate"
            exit 1
          }
          # Compare this digest with the one from your first release: a different value
          # means the keystore changed and phones will refuse to update over the old APK.
          echo "Signer certificate SHA-256: $SIGNER_SHA256"

      - name: Write release notes
        run: |
          if [ -f "packaging/release-notes-v${APK_VERSION}.md" ]; then
            cp "packaging/release-notes-v${APK_VERSION}.md" release_notes.md
          else
            printf '**MudaFork v%s** (Android build)\n' "$APK_VERSION" > release_notes.md
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: MudaFork-${{ env.APK_VERSION }}.apk
          path: ${{ env.APK_NAME }}

      - name: Publish Android asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          TITLE: ${{ github.event.inputs.title || format('MudaFork {0}', github.ref_name) }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file release_notes.md
            echo "Updated asset on existing release $TAG"
          else
            gh release create "$TAG" "$APK_NAME" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file release_notes.md
            echo "Created pre-release $TAG"
          fi

      - name: Verify published release notes and APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" --json body,isPrerelease,assets > published-release.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          release = json.loads(Path("published-release.json").read_text())
          assert release["body"].strip() == Path("release_notes.md").read_text().strip()
          name = os.environ["APK_NAME"]
          assets = [a for a in release["assets"] if a["name"] == name]
          assert len(assets) == 1 and assets[0]["size"] == Path(name).stat().st_size
          PY
