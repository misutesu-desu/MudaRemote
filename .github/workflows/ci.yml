name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Compile all Python sources
        shell: bash
        run: python -m compileall -q mudae_bot.py mudae_preset_editor.py mudae_core tests build.py

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python build.py --onefile
      - name: Verify packaged Windows metadata
        shell: pwsh
        run: |
          $expectedVersion = (Get-Content -LiteralPath .\version.json | ConvertFrom-Json).version
          $versionInfo = (Get-Item -LiteralPath .\dist\MudaRemote.exe).VersionInfo
          if ($versionInfo.ProductVersion -ne $expectedVersion) {
            throw "ProductVersion mismatch: expected $expectedVersion, got $($versionInfo.ProductVersion)"
          }
          if ($versionInfo.OriginalFilename -ne "MudaRemote.exe") {
            throw "Unexpected OriginalFilename: $($versionInfo.OriginalFilename)"
          }
      - name: Smoke-test packaged CLI
        shell: pwsh
        run: .\dist\MudaRemote.exe --help
