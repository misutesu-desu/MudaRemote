name: CI

on:
  push:
    branches:
      - work-mudafork
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Validate source integrity manifest
        run: python -m unittest tests.test_release_manifest -v
      - run: python -m unittest discover -s tests -v
      - name: Compile all Python sources
        shell: bash
        run: python -m compileall -q mudae_bot.py mudae_preset_editor.py mudae_core tests build.py

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python build.py --onefile
      - name: Verify packaged Windows metadata
        shell: pwsh
        run: |
          $expectedVersion = (Get-Content -LiteralPath .\version.json | ConvertFrom-Json).version
          $versionInfo = (Get-Item -LiteralPath .\dist\MudaFork.exe).VersionInfo
          if ($versionInfo.ProductVersion -ne $expectedVersion) {
            throw "ProductVersion mismatch: expected $expectedVersion, got $($versionInfo.ProductVersion)"
          }
          if ($versionInfo.OriginalFilename -ne "MudaFork.exe") {
            throw "Unexpected OriginalFilename: $($versionInfo.OriginalFilename)"
          }
      - name: Smoke-test packaged CLI
        shell: pwsh
        run: .\dist\MudaFork.exe --help

  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Compile the Android app and run its unit tests
        working-directory: android
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Check the debug APK
        run: |
          SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$SRC" || { echo "::error::Debug APK missing at $SRC"; exit 1; }
          cp "$SRC" MudaFork-debug.apk
          ls -lh MudaFork-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MudaFork-debug-apk
          path: MudaFork-debug.apk
          if-no-files-found: error

  android-screens:
    # Runs the debug APK in an emulator and saves what the app looks like, so the screen can be
    # reviewed without a phone. Best effort per tap; fails only when no screenshot was produced.
    needs: android-debug
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: MudaFork-debug-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Walk the app in an emulator and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash android/scripts/screens.sh apk/MudaFork-debug.apk com.mudafork.android

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MudaFork-screens
          path: screens/
          if-no-files-found: error
